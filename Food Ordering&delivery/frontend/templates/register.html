{% extends "base.html" %}

{% block title %}Register - FoodieGo{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-icon">
            👤
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join FoodieGo and start ordering.
        </p>


        <form method="POST">

            <label>Name</label>

            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>


            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>


            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Create password"
                   required>


            <button type="submit" class="btn primary full">
                Create Account
            </button>

        </form>


        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
