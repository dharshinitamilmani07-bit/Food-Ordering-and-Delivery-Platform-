{% extends "base.html" %}

{% block title %}Login - FoodieGo{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-icon">
            🍴
        </div>

        <h1>Welcome Back!</h1>

        <p class="auth-subtitle">
            Login to continue ordering delicious food.
        </p>


        <form method="POST">

            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>


            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   required>


            <button type="submit" class="btn primary full">
                Login
            </button>

        </form>


        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Create Account
            </a>
        </p>

    </div>

</div>

{% endblock %}
